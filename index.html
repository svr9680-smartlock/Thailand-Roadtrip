<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Road Trip</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}input,select,textarea{font-size:16px}.wrap{max-width:900px;margin:auto;min-height:100vh;padding-bottom:70px}.hero{background:linear-gradient(#111827,#1f2937);color:#fff;padding:25px 16px 16px;border-radius:0 0 26px 26px}.top{display:flex;justify-content:space-between;gap:10px}.hero h1{margin:0;font-size:22px}.sub{opacity:.72;font-size:13px;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#ffffff12;border:1px solid #ffffff16;border-radius:15px;padding:10px}.stat b{display:block}.stat small{opacity:.7}main{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px}.card h2,.card h3{margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:grid;gap:5px;font-size:12px;color:#4b5563}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:11px;background:#fff}textarea{min-height:80px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;cursor:pointer}.btn.primary{background:#111827;color:#fff;border-color:#111827;font-weight:700}.btn.danger{color:#b91c1c}.hide{display:none!important}.msg{padding:9px 11px;border-radius:10px;background:#f3f4f6;font-size:13px;margin-bottom:10px}.err{background:#fef2f2;color:#991b1b}.ok{background:#f0fdf4;color:#166534}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 10px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.tab.active{background:#111827;color:#fff}.dayhead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:4px 0 10px}.dayhead h2{margin:0}.muted{color:var(--muted);font-size:13px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}.item.done{opacity:.55}.row{display:flex;gap:10px}.check{width:20px;height:20px;margin-top:3px}.grow{flex:1;min-width:0}.name{font-weight:800}.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.pill{background:#f3f4f6;border-radius:999px;padding:4px 7px;font-size:12px;color:#4b5563}.note{font-size:13px;color:#4b5563;margin-top:7px;white-space:pre-wrap}.empty{text-align:center;color:var(--muted);border:1px dashed #d1d5db;border-radius:15px;padding:25px}.nav{display:flex;gap:8px;margin-bottom:10px}.nav .active{background:#111827;color:#fff}.code{font-size:18px;font-weight:900;letter-spacing:2px;background:#f3f4f6;border-radius:10px;padding:7px 9px}.member{display:inline-block;background:#f3f4f6;border-radius:999px;padding:5px 8px;font-size:12px;margin:3px}.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress div{height:100%;background:#111827}dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 24px));box-shadow:0 24px 70px #0004}dialog::backdrop{background:#0007}.modal{padding:16px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap">
<section id="setup" class="card" style="margin:20px"><h2>🔧 还没连接 Supabase</h2><p class="muted">打开 index.html，找到底部两个 PASTE_...，填入 Supabase Project URL 与 Publishable key。</p></section>
<section id="auth" class="hide"><div class="hero"><h1>🇲🇾🚗🇹🇭 Shared Road Trip</h1><div class="sub">4个人一起规划 · 实时同步</div></div><main><div class="card"><h2 id="authTitle">登录</h2><div id="authMsg"></div><form id="authForm" class="grid"><label id="nameLabel" class="full hide">名字<input id="authName"></label><label class="full">Email<input id="email" type="email" required></label><label class="full">Password<input id="password" type="password" minlength="6" required></label><button class="btn primary full">登录</button></form><div class="actions" style="margin-top:9px"><button class="btn" id="toggleAuth">第一次用？注册</button></div></div></main></section>
<section id="home" class="hide"><div class="hero"><div class="top"><div><h1>我的旅行</h1><div class="sub" id="who"></div></div><button class="btn" id="logout">退出</button></div></div><main><div id="homeMsg"></div><div class="card"><h2>＋ 建立新旅行</h2><form id="createForm" class="grid"><label class="full">标题<input id="newTitle" value="🇲🇾🚗🇹🇭 Thailand Road Trip 2026"></label><label>天数<input id="newDays" type="number" min="1" max="30" value="9"></label><label>人数<input id="newPeople" type="number" min="1" max="20" value="4"></label><label class="full">共同预算 RM<input id="newBudget" type="number" min="0" value="5500"></label><button class="btn primary full">建立旅行</button></form></div><div class="card"><h2>👥 加入朋友旅行</h2><form id="joinForm" class="grid"><label class="full">Invite Code<input id="joinCode" maxlength="8" placeholder="A1B2C3D4"></label><button class="btn primary full">加入</button></form></div><div class="card"><h2>你的旅行</h2><div id="tripList" class="muted">Loading…</div></div></main></section>
<section id="trip" class="hide"><div class="hero"><div class="top"><div><h1 id="tripTitle"></h1><div class="sub" id="tripSub"></div></div><button class="btn" id="back">旅行列表</button></div><div class="stats"><div class="stat"><b id="planned">RM0</b><small>已计划</small></div><div class="stat"><b id="left">RM0</b><small>预算剩余</small></div><div class="stat"><b id="count">0</b><small>项目</small></div></div></div><main><div class="nav"><button id="navPlan" class="btn active">📅 行程</button><button id="navInfo" class="btn">👥 共享 / 设置</button></div><section id="planPanel"><div class="card"><div class="progress"><div id="prog"></div></div><div class="muted" id="budgetText" style="margin-top:6px"></div></div><div class="tabs" id="days"></div><div class="dayhead"><div><h2 id="dayLabel"></h2><div class="muted" id="route"></div></div><button id="add" class="btn primary">＋ 添加</button></div><div id="items"></div></section><section id="infoPanel" class="hide"><div class="card"><h3>🔗 Invite Code</h3><div class="actions"><span id="code" class="code"></span><button id="copy" class="btn">复制邀请</button></div><p class="muted">朋友用同一个网址注册/登录，再输入这个 Code，就会进入同一趟旅行。</p></div><div class="card"><h3>👥 成员</h3><div id="members"></div></div><div class="card"><h3>⚙️ 旅行设置</h3><form id="settings" class="grid"><label class="full">标题<input id="setTitle"></label><label>天数<input id="setDays" type="number" min="1" max="30"></label><label>人数<input id="setPeople" type="number" min="1" max="20"></label><label class="full">共同预算 RM<input id="setBudget" type="number" min="0"></label><label class="full">当前 Day 路线<input id="setRoute"></label><button class="btn primary full">保存设置</button></form><p class="muted">V3 默认所有成员都可以修改行程与设置。</p></div></section></main></section>
</div>
<dialog id="itemDialog"><form id="itemForm" class="modal"><h3 id="itemHead">添加</h3><div class="grid"><label class="full">名称<input id="iName" required></label><label>类别<select id="iCat"><option>🍜 美食</option><option>📍 景点</option><option>🏨 酒店</option><option>🛍️ 购物</option><option>💆 按摩</option><option>⛽ 加油 / 休息</option><option>🚗 交通 / Border</option><option>📝 其他</option></select></label><label>优先级<select id="iPri"><option>⭐ 必去</option><option selected>👍 想去</option><option>🙂 有空再去</option></select></label><label class="full">地点<input id="iLoc"></label><label>预计 RM<input id="iCost" type="number" min="0" step="0.01" value="0"></label><label class="full">Google Maps / 链接<input id="iLink" type="url"></label><label class="full">备注<textarea id="iNote"></textarea></label></div><div class="modal-actions"><button type="button" class="btn" id="cancel">取消</button><button class="btn primary">保存</button></div></form></dialog>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://ceqhalixfvokidpulqvt.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_HD2dVdLWhzz7pBwjXN6VgQ_u37Nw8-v';
const ok=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('PASTE_')&&SUPABASE_PUBLISHABLE_KEY.startsWith('sb_')&&!SUPABASE_PUBLISHABLE_KEY.includes('PASTE_');
const $=x=>document.getElementById(x),views=[$('auth'),$('home'),$('trip')];let sb,user,mode='login',cur=null,members=[],items=[],day=1,editing=null,ch=null;
function show(v){views.forEach(x=>x.classList.add('hide'));v.classList.remove('hide')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return'RM'+Number(n||0).toLocaleString('en-MY',{maximumFractionDigits:2})}function msg(el,t,c=''){el.innerHTML=t?`<div class="msg ${c}">${esc(t)}</div>`:''}function name(){return user?.user_metadata?.display_name||user?.email?.split('@')[0]||'Traveller'}
if(ok){$('setup').classList.add('hide');sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);init()}async function init(){let{data:{session}}=await sb.auth.getSession();user=session?.user||null;if(user)await openHome();else show($('auth'));const q=new URLSearchParams(location.search).get('join');if(q)$('joinCode').value=q.toUpperCase()}
$('toggleAuth').onclick=()=>{mode=mode==='login'?'register':'login';$('authTitle').textContent=mode==='login'?'登录':'注册';$('authForm').querySelector('button').textContent=mode==='login'?'登录':'注册';$('nameLabel').classList.toggle('hide',mode==='login');$('toggleAuth').textContent=mode==='login'?'第一次用？注册':'已有账号？登录'};
$('authForm').onsubmit=async e=>{e.preventDefault();try{if(mode==='register'){let{data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{display_name:$('authName').value.trim()||$('email').value.split('@')[0]}}});if(error)throw error;if(data.session){user=data.user;await openHome()}else msg($('authMsg'),'注册成功，请去 Email 点确认链接后回来登录。','ok')}else{let{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;user=data.user;await openHome()}}catch(x){msg($('authMsg'),x.message,'err')}};
$('logout').onclick=async()=>{await sb.auth.signOut();user=null;show($('auth'))};$('back').onclick=async()=>{if(ch)await sb.removeChannel(ch);cur=null;await openHome()};
async function openHome(){show($('home'));$('who').textContent=user.email;await loadTrips()}async function loadTrips(){let{data,error}=await sb.from('trips').select('*').order('created_at',{ascending:false});if(error){msg($('homeMsg'),error.message,'err');return}$('tripList').innerHTML=data.length?data.map(t=>`<button class="btn" data-id="${t.id}" style="width:100%;text-align:left;margin:4px 0"><b>${esc(t.title)}</b><br><span class="muted">${t.days}天 · ${t.people}人 · ${money(t.budget_target)} · ${esc(t.invite_code)}</span></button>`).join(''):'<div class="empty">还没有旅行。</div>';$('tripList').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openTrip(b.dataset.id))}
$('createForm').onsubmit=async e=>{e.preventDefault();let{data,error}=await sb.rpc('create_trip',{p_title:$('newTitle').value,p_days:+$('newDays').value,p_budget:+$('newBudget').value,p_people:+$('newPeople').value,p_name:name()});if(error)return msg($('homeMsg'),error.message,'err');await openTrip(data[0].trip_id)};
$('joinForm').onsubmit=async e=>{e.preventDefault();let{data,error}=await sb.rpc('join_trip_by_code',{p_code:$('joinCode').value.trim(),p_name:name()});if(error)return msg($('homeMsg'),error.message,'err');history.replaceState({},'',location.pathname);await openTrip(data)};
async function openTrip(id){let{data,error}=await sb.from('trips').select('*').eq('id',id).single();if(error)return msg($('homeMsg'),error.message,'err');cur=data;show($('trip'));await refresh();if(ch)await sb.removeChannel(ch);ch=sb.channel('trip-'+id).on('postgres_changes',{event:'*',schema:'public',table:'trips',filter:`id=eq.${id}`},refresh).on('postgres_changes',{event:'*',schema:'public',table:'trip_members',filter:`trip_id=eq.${id}`},refresh).on('postgres_changes',{event:'*',schema:'public',table:'items',filter:`trip_id=eq.${id}`},refresh).subscribe()}
async function refresh(){if(!cur)return;let[a,b,c]=await Promise.all([sb.from('trips').select('*').eq('id',cur.id).single(),sb.from('trip_members').select('*').eq('trip_id',cur.id).order('joined_at'),sb.from('items').select('*').eq('trip_id',cur.id).order('created_at')]);if(a.data)cur=a.data;if(b.data)members=b.data;if(c.data)items=c.data;render()}
function routes(){let r=Array.isArray(cur.routes)?[...cur.routes]:[];while(r.length<cur.days)r.push(`Day ${r.length+1} · 自定义行程`);return r}function render(){if(day>cur.days)day=cur.days;$('tripTitle').textContent=cur.title;$('tripSub').textContent=`${cur.days}天 · ${cur.people}人同行`;let total=items.reduce((s,x)=>s+Number(x.cost||0),0),rem=Number(cur.budget_target)-total;$('planned').textContent=money(total);$('left').textContent=money(rem);$('count').textContent=items.length;$('prog').style.width=(cur.budget_target?Math.min(100,total/cur.budget_target*100):0)+'%';$('budgetText').textContent=`预算 ${money(cur.budget_target)} · 已计划 ${money(total)} · ${rem>=0?'剩余':'超出'} ${money(Math.abs(rem))}`;$('days').innerHTML=Array.from({length:cur.days},(_,i)=>`<button class="tab ${day===i+1?'active':''}" data-d="${i+1}">Day ${i+1}</button>`).join('');$('days').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{day=+b.dataset.d;render()});$('dayLabel').textContent='Day '+day;$('route').textContent=routes()[day-1];let arr=items.filter(x=>x.day_no===day);$('items').innerHTML=arr.length?arr.map(x=>`<div class="item ${x.done?'done':''}"><div class="row"><input class="check" type="checkbox" data-done="${x.id}" ${x.done?'checked':''}><div class="grow"><div class="name">${esc(x.name)}</div><div class="pills"><span class="pill">${esc(x.category)}</span><span class="pill">${esc(x.priority)}</span>${x.location?`<span class="pill">📌 ${esc(x.location)}</span>`:''}${+x.cost?`<span class="pill">${money(x.cost)}</span>`:''}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="actions" style="margin-top:8px">${x.link?`<a class="btn" href="${esc(x.link)}" target="_blank">地图</a>`:''}<button class="btn" data-edit="${x.id}">编辑</button><button class="btn danger" data-del="${x.id}">删除</button></div></div></div></div>`).join(''):'<div class="empty">这一天还没有项目。</div>';$('items').querySelectorAll('[data-done]').forEach(c=>c.onchange=()=>sb.from('items').update({done:c.checked}).eq('id',c.dataset.done));$('items').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openItem(b.dataset.edit));$('items').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delItem(b.dataset.del));$('code').textContent=cur.invite_code;$('members').innerHTML=members.map(m=>`<span class="member">${m.role==='owner'?'👑':'👤'} ${esc(m.display_name)}</span>`).join('');$('setTitle').value=cur.title;$('setDays').value=cur.days;$('setPeople').value=cur.people;$('setBudget').value=cur.budget_target;$('setRoute').value=routes()[day-1]}
$('navPlan').onclick=()=>panel('plan');$('navInfo').onclick=()=>panel('info');function panel(x){$('planPanel').classList.toggle('hide',x!=='plan');$('infoPanel').classList.toggle('hide',x!=='info');$('navPlan').classList.toggle('active',x==='plan');$('navInfo').classList.toggle('active',x==='info')}
$('settings').onsubmit=async e=>{e.preventDefault();let d=Math.max(1,Math.min(30,+$('setDays').value)),r=routes();while(r.length<d)r.push(`Day ${r.length+1} · 自定义行程`);r[day-1]=$('setRoute').value.trim()||r[day-1];let{error}=await sb.from('trips').update({title:$('setTitle').value.trim()||cur.title,days:d,people:Math.max(1,+$('setPeople').value),budget_target:Math.max(0,+$('setBudget').value),routes:r}).eq('id',cur.id);if(error)alert(error.message)};
$('add').onclick=()=>openItem();$('cancel').onclick=()=>$('itemDialog').close();function openItem(id){editing=id?items.find(x=>x.id===id):null;$('itemHead').textContent=editing?'编辑':'添加';$('iName').value=editing?.name||'';$('iCat').value=editing?.category||'🍜 美食';$('iPri').value=editing?.priority||'👍 想去';$('iLoc').value=editing?.location||'';$('iCost').value=editing?.cost||0;$('iLink').value=editing?.link||'';$('iNote').value=editing?.note||'';$('itemDialog').showModal()}
$('itemForm').onsubmit=async e=>{e.preventDefault();let p={trip_id:cur.id,day_no:day,name:$('iName').value.trim(),category:$('iCat').value,priority:$('iPri').value,location:$('iLoc').value.trim(),cost:Math.max(0,+$('iCost').value||0),link:$('iLink').value.trim(),note:$('iNote').value.trim()};let error;if(editing){({error}=await sb.from('items').update(p).eq('id',editing.id))}else{p.created_by=user.id;({error}=await sb.from('items').insert(p))}if(error)return alert(error.message);$('itemDialog').close()};async function delItem(id){if(!confirm('确定删除吗？'))return;let{error}=await sb.from('items').delete().eq('id',id);if(error)alert(error.message)}
$('copy').onclick=async()=>{let link=`${location.origin}${location.pathname}?join=${cur.invite_code}`,text=`加入我们的旅行：${cur.title}\nInvite Code: ${cur.invite_code}\n${link}`;try{await navigator.clipboard.writeText(text);$('copy').textContent='已复制 ✅';setTimeout(()=>$('copy').textContent='复制邀请',1200)}catch{prompt('复制给朋友：',text)}};
</script></body></html>
